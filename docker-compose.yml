version: '3.8'

services:

  
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: analytics-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analytics-network

  api:
    build:
      context: .
      dockerfile: WebAnalytics.API/Dockerfile
    container_name: analytics-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/analytics.db
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
      - JWT__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong123456
    ports:
      - "5000:80"
    volumes:
      - sqlite-data:/app/data  
    depends_on:
      - rabbitmq
    networks:
      - analytics-network

  consumer:
    build:
      context: .
      dockerfile: WebAnalytics.Consumer/Dockerfile
    container_name: analytics-consumer
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/analytics.db
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
    volumes:
      - sqlite-data:/app/data   
    depends_on:
      - rabbitmq
    networks:
      - analytics-network

volumes:
  sqlite-data:  
  rabbitmq-data:

networks:
  analytics-network:
    driver: bridge